<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda-11</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-sm-4 mt-5">
                <h3 style="border-bottom:2px solid grey;">Agenda No.11</h3>
                <form action="" method="" enctype="">
                    <div class="my-2">
                        <label for="name" class="form-label">Name Of Town</label>
                        <input type="text" class="form-control" id="name" style="border:2px solid grey;">
                    </div>  
                    <div class="my-2">
                        <label for="target" class="form-label">SEP(l) Target</label>
                        <input type="text" class="form-control" id="target" style="border:2px solid grey;">
                    </div>  
                     <div class="my-2">
                        <label for="cases" class="form-label">SEP(l) Cases Sponsored to Bank</label>
                        <input type="text" class="form-control" id="cases" style="border:2px solid grey;">
                    </div> 
                     <div class="my-2">
                        <label for="sanctioned" class="form-label">Sanctioned</label>
                        <input type="text" class="form-control" id="sanctioned" style="border:2px solid grey;">
                    </div> 
                     <div class="my-2">
                        <label for="loan" class="form-label">Disbursement of Loan</label>
                        <input type="text" class="form-control" id="loan" style="border:2px solid grey;">
                    </div> 
                     <div class="my-2">
                        <label for="amount" class="form-label">Total Amount Dis.(IN LAKH)</label>
                        <input type="text" class="form-control" id="amount" style="border:2px solid grey;">
                    </div>
                      <div class="my-2">
                        <label for="case" class="form-label">Case Pending at Bank Level</label>
                        <input type="text" class="form-control" id="case" style="border:2px solid grey;">
                    </div> 
                  
                    <input type="submit" value="Submit" class="btn btn-primary">
                </form>
            </div>
        </div>
    </div>
</body>

</html>
