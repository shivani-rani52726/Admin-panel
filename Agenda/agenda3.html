<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda-3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-sm-4 mt-5">
                <h3 style="border-bottom:2px solid grey;">Agenda No.3</h3>
                <form action="" method="" enctype="">
                    <div class="my-2">
                        <label for="name" class="form-label">MC Name</label>
                        <input type="text" class="form-control" id="name" style="border:2px solid grey;">
                    </div> 
                        <div class="my-2">
                        <label for="grievance" class="form-label">Total Grievance</label>
                        <input type="text" class="form-control" id="grievance" style="border:2px solid grey;">
                    </div> 
                        <div class="my-2">
                        <label for="resolved" class="form-label">Total Resolved</label>
                        <input type="text" class="form-control" id="resolved" style="border:2px solid grey;">
                    </div>   
                      <div class="my-2">
                        <label for="pending" class="form-label">Total Pending</label>
                        <input type="text" class="form-control" id="pending" style="border:2px solid grey;">
                    </div>
                    <input type="submit" value="Submit" class="btn btn-primary">

                </form>
            </div>
        </div>
    </div>
</body>

</html>
