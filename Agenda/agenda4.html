<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda-4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-sm-4 mt-5">
                <h3 style="border-bottom:2px solid grey;">Agenda No.4</h3>
                <form action="" method="" enctype="">
                    <div class="my-2">
                        <label for="name" class="form-label">Name Of MC</label>
                        <input type="text" class="form-control" id="name" style="border:2px solid grey;">
                    </div>  
                    <div class="my-2">
                        <label for="dt-colony" class="form-label">Total number of Colonies received from H.Q./DTCP.</label>
                        <input type="text" class="form-control" id="dt-colony" style="border:2px solid grey;">
                    </div>  
                     <div class="my-2">
                        <label for="hm-colony" class="form-label">Total number of Colonies for which resolution have been passed By the House of the Municipalities.</label>
                        <input type="text" class="form-control" id="hm-colony" style="border:2px solid grey;">
                    </div> 
                     <div class="my-2">
                        <label for="hq-colony" class="form-label">Total number of Colonies for which the cases have been sent to H.Q.</label>
                        <input type="text" class="form-control" id="hq-colony" style="border:2px solid grey;">
                    </div> 
                  
                    <input type="submit" value="Submit" class="btn btn-primary">

                </form>
            </div>
        </div>
    </div>
</body>

</html>
