        <div class="row justify-content-center">

                        <input type="text" class="form-control my-2" id="" style="border:2px solid grey;" placeholder="Recovery upto Previous month (In Lacs)">

                        <input type="text" class="form-control my-2" id="" style="border:2px solid grey;" placeholder="Balance (In Lacs)">
                        <input type="text" class="form-control my-2" id="" style="border:2px solid grey;" placeholder="Percentage of Recovery">

                    <input type="submit" value="Submit" class="btn btn-primary">

                   
                </form>
            </div>

    </div>
