<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda-5</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-sm-4 mt-5">
                <h3 style="border-bottom:2px solid grey;">Agenda No.5</h3>
                <form action="" method="" enctype="">
                    <div class="my-2">
                        <label for="name" class="form-label">Name Of Municipality</label>
                        <input type="text" class="form-control" id="name" style="border:2px solid grey;">
                    </div>  
                    <div class="my-2">
                        <label for="during-month" class="form-label">Encroachments Found during Month</label>
                        <input type="text" class="form-control" id="" style="border:2px solid grey;" placeholder="Temporary">
                        <input type="text" class="form-control my-2" id="" style="border:2px solid grey;" placeholder="Permanent">
                    </div>  
                     <div class="my-2">
                        <label for="upto-month" class="form-label">Encroachments pending upto last Month</label>
                        <input type="text" class="form-control" id="" style="border:2px solid grey;" placeholder="Temporary">
                        <input type="text" class="form-control my-2" id="" style="border:2px solid grey;" placeholder="Permanent">
                    </div> 
                     <div class="my-2">
                        <label for="nos" class="form-label">Total Nos of Encroachments removed during Month</label>
                        <input type="text" class="form-control" id="" style="border:2px solid grey;" placeholder="Temporary">
                        <input type="text" class="form-control my-2" id="" style="border:2px solid grey;" placeholder="Permanent">
                    </div> 
                       <div class="my-2">
                        <label for="balance" class="form-label">Balance Encroachments yet to remove</label>
                        <input type="text" class="form-control" id="" style="border:2px solid grey;" placeholder="Temporary">
                        <input type="text" class="form-control my-2" id="" style="border:2px solid grey;" placeholder="Permanent">
                    </div> 
                  
                    <input type="submit" value="Submit" class="btn btn-primary">

                </form>
            </div>
        </div>
    </div>
</body>

</html>
