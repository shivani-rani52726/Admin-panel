<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="../bootstrap files/bootstrap_5.3.1.css">
    <style>
        body {
            background-image: url("../img/pic4.jpg");
            background-repeat: no-repeat;
            background-size: cover;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <h3 class="text-center text-light">Registration Form</h3>
            </div>
        </div>
        <form action="" method="post">
            <div class="row">
                <div class="col-md-3">
                    <label for="" class="form-label text-light">First Name</label>
                    <input type="text" name="firstname" class="form-control" placeholder="">
                </div>
                <div class="col-md-3">
                    <label for="" class="form-label text-light">Last Name</label>
                    <input type="text" name="lastname" class="form-control" placeholder="">
                </div>
            </div>
            <div class="row">
                <div class="col-md-3">
                    <label for="" class="form-label text-light">E-mail</label>
                    <input type="email" name="email" class="form-control" placeholder="">
                </div>
                <div class="col-md-3">
                    <label for="" class="form-label text-light">Mobile No.</label>
                    <input type="number" name="mobile no" class="form-control" placeholder="">
                </div>
            </div>
            <div class="row">
                <div class="col-md-3">
                    <label for="" class="form-label text-light">City</label>
                    <input type="text" name="city" class="form-control" placeholder="">
                </div>
                <div class="col-md-3">
                    <label for="" class="form-label text-light">Distt.</label><br>
                    <select class="w-100 h-50 rounded">
                        <option value="">Bathinda</option>
                        <option value="">Patiala</option>
                        <option value="">Fatehabad</option>
                        <option value="">Barnala</option>
                        <option value="">Abohar</option>
                    </select><br>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <label for="" class="form-label text-light">Full Address</label><br>
                    <textarea class="w-100"></textarea>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <label for="" class="form-label text-light">Aadhar No</label>
                    <input type="text" name="adhar no" class="form-control" placeholder="">
                </div>
            </div>
            <div class="row">
                <div class="col-md-3">
                    <label for="" class="form-label text-light">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="">
                </div>
                <div class="col-md-3">
                    <label for="" class="form-label text-light">confirm Password</label>
                    <input type="password" name="password" class="form-control" placeholder="">
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <label for="" class="form-label text-light">Image</label>
                    <input type="file" name="image" class="form-control" placeholder=""><br>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <button type="submit" class="btn btn-primary mx-auto d-block">Submit Record</button>
                </div>
            </div>
        </form>
    </div>
</body>

</html>
