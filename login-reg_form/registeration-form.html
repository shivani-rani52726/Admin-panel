<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <!-- https://cdnjs.com/libraries/twitter-bootstrap/5.0.0-beta1 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.0.0-beta1/css/bootstrap.min.css"
    />

    <!-- Icons: https://getbootstrap.com/docs/5.0/extend/icons/ -->
    <!-- https://cdnjs.com/libraries/font-awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css"
    />
    <style>
        *{
            margin:0px;
            padding:0px;
            box-sizing: border-box;
            font-size:12px;
        }
    </style>

    <title>registration-form</title>
  </head>
  <body class="vw-100 vh-100">

    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-sm-4 mt-5">
                <h3 class="text-center">Register</h3>
                <div>
                    <form action="" method="" enctype="multipart/form-data">
                        <div class="my-2">
                            <label for="first-name" class="my-2 fw-bold">First Name<span class="text-danger">*</span></label>
                            <input type="text" class="w-100 form-control" name="first-name" id="first-name">
                        </div> 
                        <div class="my-2">
                            <label for="last-name" class="my-2 fw-bold">Last Name<span class="text-danger">*</span></label>
                            <input type="text" class="w-100 form-control" name="last-name" id="last-name">
                        </div> 
                         <div class="my-2">
                            <label for="email" class="my-2 fw-bold">Email<span class="text-danger">*</span></label>
                            <input type="email" class="w-100 form-control" name="email" id="email">
                        </div> 
                        <div class="my-2">
                            <label for="phone" class="my-2 fw-bold">Phone<span class="text-danger">*</span></label>
                            <input type="tel" class="w-100 form-control" name="phone" id="phone" placeholder="+15555555555" maxlength="10">
                        </div> 
                        <div class="my-2">
                            <label for="date" class="my-2 fw-bold">Date Of Birth<span class="text-danger">*</span></label>
                            <input type="date" class="w-100 form-control" name="date" id="date">
                        </div>
                        <div class="my-2">
                            <label for="password" class="my-2 fw-bold">Password<span class="text-danger">*</span></label>
                            <input type="password" class="w-100 form-control" name="Password" id="password">
                        </div>
                        <div class="my-2">
                            <label for="confirm-password" class="my-2 fw-bold">Confirm Password<span class="text-danger">*</span></label>
                            <input type="password" class="w-100 form-control" name="confirm-password" id="confirm-password">
                        </div>
                        <div class="my-2">
                            <label for="photo-id" class="my-2 fw-bold">Photo ID<span class="text-danger">*</span></label>
                            <input type="file" class="w-100 form-control" name="photo-id" id="photo-id">
                            <span>Image must be type of jpg.jpeg or png.</span>
                        </div>
                         <div class="my-2">
                            <label for="selfie-id" class="my-2 fw-bold">Selfie with Photo ID<span class="text-danger">*</span></label>
                            <input type="file" class="w-100 form-control" name="selfie-id" id="selfie-id">
                            <span>Image must be type of jpg.jpeg or png.</span>
                        </div>
                        <div class="my-2 d-flex">
                            <input type="checkbox"  name="reminder" id="reminder">
                            <label for="reminder" class="my-2 mx-2">I agree to the Privacy Policy</label>
                        </div>
                        <div class="my-2">
                            <button type="button" class="w-100 bg-dark text-light text-center">CREATE ACCOUNT</button>
                        </div>
                        <div class="my-2">
                            <span class="text-center d-block">Already Have an Account?</span>
                        </div>
                        <div class="my-2">
                            <button type="button" class="w-100  text-center">SIGN IN</button>
                        </div>
                    </form>
                  
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.0.0-beta1/js/bootstrap.bundle.min.js"></script>
     <script
      src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.5.4/umd/popper.min.js"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.0.0-beta1/js/bootstrap.min.js"
    ></script>

  </body>
</html>
