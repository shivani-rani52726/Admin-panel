<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            text-decoration: none;
            list-style: none;
            appearance: none;
        }

        body {
            font-family: 'poppins', sans-serif;
            width: 100vw;
            font-size: 0.88rem;
            user-select: none;
            overflow-x: hidden;
            /* background:var(--clr-color-background); */
        }

        .sidebar {
            background-color: white;
            display: flex;
            flex-direction: column;
            position: relative;
            top: 0;
            /* Adjusted to top for fixed position */
            bottom: 0;
            /* Adjusted to bottom for fixed position */
            left: 0;
            /* Adjusted to left for fixed position */
            overflow-y: auto;
            width: 250px;
            height:100vh;
            /* Adjusted sidebar width */
            /* Added to enable vertical scrollbar */
        }

        a {
            color: black;
            text-decoration: none;
        }

        h3 {
            font-weight: bold;
            font-size: 12px;
        }

        .logo h2 {
            font-size: 1.5rem;
            /* Adjusted logo font size */
            margin: 0;
            /* Resetting margin */
            padding: 10px 0;
            /* Added padding for spacing */
            color: black;
            /* Added color */
        }

        .sidebar a {
            display: flex;
            color: black;
            gap: 1rem;
            align-items: center;
            height: 3.2rem;
            padding-left: 20px;
            /* Adjusted padding for better appearance */
            transition: all .1s ease-in;
        }

        .sidebar a span {
            font-size: 1.6rem;
            transition: all .1s ease-in;
        }

        .sidebar a.active {
            background: grey;
            color: var(--clr-primary);
            margin-left: 0;
            border-left: 5px solid blue;
        }

        .profile-photo {
            width: 2.8rem;
            height: 2.8rem;
            border-radius: 50%;
            overflow: hidden;
            margin-top: -10px;
        }

        .dropdown-menu {
            z-index: 1;
            /* Set z-index to make sure it's above other content */
        }

     /* .sidebar a:last-child{
        position:absolute;
        top:800px;
        left:0px;
     } */
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row mt-3" style="border-bottom:1px solid grey;">
            <div class="col-sm-3">
                <div class="logo">
                    <h2>S<span class="text-danger">shakya</span></h2>
                </div>
            </div>
            <div class="col-sm-6"></div>
            <div class="col-sm-3" style="display:flex;">
                <div>
                    <input type="search" name="" id="" style="float:right;" class="rounded-pill ps-2 w-50"
                        placeholder="search">
                </div>
                <div>
                    <img src="../img/john.jpg" alt="" srcset="" height="50px" class="profile-photo ms-3">
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-sm-2" style="border-right:1px solid grey;">
                <div class="sidebar" id="sidebar">
                    <a href="" style="border-bottom:1px solid grey;width:91%;">
                        <span class="material-symbols-outlined">grid_view</span>
                        <h3>Dashboard</h3>
                    </a>
                    <a href="#">
                        <span class="material-symbols-outlined">person_outline</span>
                        <h3>Customers</h3>
                    </a>

                    <!-- Dropdown for All Forms -->
                    <div class="dropdown">
                        <a href="#" class="dropdown-toggle" id="dropdownMenuButton1" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            <span class="material-symbols-outlined">insights</span>
                            <h3>All Forms</h3>
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton1">
                            <li><a class="dropdown-item" href="#">Form 1</a></li>
                            <li><a class="dropdown-item" href="#">Form 2</a></li>
                            <li><a class="dropdown-item" href="#">Form 3</a></li>
                        </ul>
                    </div>

                    <!-- Dropdown for Tables -->
                    <div class="dropdown">
                        <a href="#" class="dropdown-toggle" id="dropdownMenuButton2" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            <span class="material-symbols-outlined">mail_outline</span>
                            <h3>Tables</h3>
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton2">
                            <li><a class="dropdown-item" href="#">Table 1</a></li>
                            <li><a class="dropdown-item" href="#">Table 2</a></li>
                            <li><a class="dropdown-item" href="#">Table 3</a></li>
                        </ul>
                    </div>
                    <a href="#">
                        <span class="material-symbols-outlined">receipt_long</span>
                        <h3>Products</h3>
                    </a>
                    <a href="#">
                        <span class="material-symbols-outlined">report_gmailerrorred</span>
                        <h3>Reports</h3>
                    </a>
                    <a href="#">
                        <span class="material-symbols-outlined">settings</span>
                        <h3>Settings</h3>
                    </a>
                    <a href="#">
                        <span class="material-symbols-outlined">add</span>
                        <h3>Add product</h3>
                    </a>
                    <a href="#">
                        <span class="material-symbols-outlined">logout</span>
                        <h3>Logout</h3>
                    </a>
                </div>
            </div>
            <div class="col-sm-10">
                <div class="row">
                    <div class="col-sm-12" style="background-color: grey;margin:100px 70px;border:2px solid red;;">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
