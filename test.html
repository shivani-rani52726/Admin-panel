<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>category</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
         * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div id="app" class="container">
        <div class="row">
            <h5>Categories</h5>
        </div>
        <div class="row">
            <div class="col-sm-6">
                <button type="button" class="btn btn-success border-success" @click="addInput">+ Add New</button>
            </div>
            <div class="col-sm-6">
                <input type="text" placeholder="Search" class="px-2 py-1" v-model="searchText" style="float: right;">
            </div>
        </div>
        <div class="category-list">
            <div class="row mt-4" v-for="(category, index) in categories" :key="index">
                <div class="col-sm-11">
                    <input type="text" placeholder="New Category" class="w-100 px-3" v-model="category.name">
                </div>
                <div class="col-sm-1">
                    <i class="fa-solid fa-trash-can text-success" style="float: right;" @click="deleteInput(index)"></i>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <script>
        new Vue({
            el: '#app',
            data: {
                categories: [],
                searchText: ''
            },
            methods: {
                addInput() {
                    this.categories.push({ name: '' });
                },
                deleteInput(index) {
                    this.categories.splice(index, 1);
                }
            }
        });
    </script>
</body>
</html>
