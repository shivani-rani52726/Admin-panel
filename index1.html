<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin-panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<Style>
    *{
    margin:0;
    padding:0;
    box-sizing: border-box;
    text-decoration: none;
    list-style: none;
    appearance:none;
}
body{
    font-family:'poppins',sans-serif;
    width:100vw;
    font-size:0.88rem;
    user-select: none;
    overflow-x:hidden;
    /* background:var(--clr-color-background); */
}
    .sidebar{
    background-color:white;
    display: flex;
    flex-direction: column;
    height:85vh;
    position: relative;
    top:1rem;
}
a{
    color:black;
    text-decoration: none;
}
h3{
    font-weight:bold;
    font-size:12px;
}
.sidebar a{
    display: flex;
    color:black;
    margin-left:2rem;
    gap:1rem;
    align-items: center;
    height:3.2rem;
    transition:all .1s ease-in;
}
.sidebar a span{
    font-size:1.6rem;
    transition:all .1s ease-in;
}
.sidebar a:last-child{
    position: absolute;
    bottom:1rem;
    width:100%
}
 .sidebar a.active{
    background:grey;
    color:var(--clr-primary);
    margin-left:0;
    border-left:5px solid blue;
}
.profile-photo{
    width:2.8rem;
    height:2.8rem;
    border-radius:50%;
    overflow:hidden;
    margin-top:-10px;
}
</Style>

                        placeholder="search">

                <div>

                </div>

        </div>
