<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-sm-4">
                <h3 class="text-center">Form-3</h3>
                <form action="" method="post">
                    <div class="my-2">
                        <label for="name">ULB Name</label>
                        <input type="text" name="name" id="name" class="w-100">
                    </div>

                    <div class="my-2">
                        <label for="Objection">No. of Objection analysis</label>
                        <input type="text" name="Objection" id="Objection" class="w-100">
                    </div>

                    <div class="my-2">
                        <label for="reverted">No. of wrongly rejected/reverted found</label>
                        <input type="text" name="reverted" id="reverted" class="w-100">
                    </div>

                    <div class="my-2">
                        <label for="Taken">Disciplinary Action Taken/Penality Imposed</label>
                        <input type="text" name="Taken" id="Taken" class="w-100">
                    </div>

                    <div class="my-2">
                        <label for="Remarks">Remarks</label>
                        <input type="text" name="Remarks" id="Remarks" class="w-100">
                    </div>

                    <div class="my-2">
                        <input type="submit" value="submit" class="btn btn-primary">
                    </div>
                </form>
            </div>
        </div>


    </div>
</body>
</html>
