<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-sm-4">
                <h3 class="text-center">Form-4</h3>
                <form action="" method="post">
                    <div class="my-2">
                        <label for="name">MC Name</label>
                        <input type="text" name="name" id="name" class="w-100">
                    </div>

                    <div class="my-2">
                        <label for="Helpdesk">Establishment of Helpdesk</label>
                        <input type="text" name="Helpdesk" id="Helpdesk" class="w-100">
                    </div>

                    <div class="my-2">
                        <label for="Deployment">No. of Deployment of trained official</label>
                        <input type="text" name="Deployment" id="Deployment" class="w-100">
                    </div>

                    <div class="my-2">
                        <label for="conducted">Detail of Training conducted</label>
                        <input type="text" name="conducted" id="conducted" class="w-100">
                    </div>

                    <div class="my-2">
                        <label for="Remarks">Remarks</label>
                        <input type="text" name="Remarks" id="Remarks" class="w-100">
                    </div>

                    <div class="my-2">
                        <input type="submit" value="submit" class="btn btn-primary">
                    </div>
                </form>
            </div>
        </div>


    </div>
</body>
</html>
