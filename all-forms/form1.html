<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        *{
            margin:0px;
            padding:0px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-sm-4">
                <h3 class="text-center">Form-1</h3>
                <form action="" method="post">
                    <div class="my-2">
                        <label for="name">USB name</label>
                        <input type="text" name="name" id="name" class="w-100">
                    </div>

                    <div class="my-2">
                        <label for="survey">New Data as on date (New Survey +New PID Created)</label>
                        <input type="date" name="survay" id="survey" class="w-100">
                    </div>

                    <div class="my-2">
                        <label for="ndc">NDC data as on 17.01.2024</label>
                        <div class="p-2 rounded" style="border:2px solid grey;">
                            <div class="my-2">
                                <label for="new-survey">Integrated (new Survay)</label>
                                <input type="date" name="new-survey" id="new-survey" class="w-100">
                            </div>
                            <div class="my-2">
                                <label for="new-data">Non-Integrated (New Data)</label>
                                <input type="date" name="new-data" id="new-data" class="w-100">
                            </div>
                            <div class="my-2">
                                <label for="old-data">Non-Integrated (Old Data)</label>
                                <input type="date" name="old-data" id="old-data" class="w-100">
                            </div>
                        </div>
                        
                    </div>

                    <div class="my-2">
                        <label for="Integration">Integration done using LINK-DELINK Option</label>
                        <input type="text" name="Integration" id="Integration" class="w-100">
                    </div>

                    <div class="my-2">
                        <label for="Integration2">% of Integration</label>
                        <input type="text" name="Integration2" id="Integration2" class="w-100">
                    </div>

                    <div class="my-2">
                        <label for="points">Explanations regarding all points/indicators, if any</label>
                        <input type="text" name="points" id="points" class="w-100">
                    </div>

                    <div class="my-2">
                        <label for="Pendency">Total Pendency as on date 17.01.2024</label>
                        <input type="text" name="Pendency" id="Pendency" class="w-100">
                    </div>

                    <div class="my-2">
                        <label for="Remarks">Reason of Pendency /Remarks</label>
                        <input type="text" name="Remarks" id="Remarks" class="w-100">
                    </div>
                    <div class="my-2">
                        <input type="submit" value="submit" class="btn btn-primary">
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
