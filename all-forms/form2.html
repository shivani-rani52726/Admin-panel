<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        *{
            margin:0px;
            padding:0px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-sm-4">
                <h3 class="text-center">Form-2</h3>
                <form action="" method="post">
                    <div class="my-2">
                        <label for="name">MC name</label>
                        <input type="text" name="name" id="name" class="w-100">
                    </div>
                    <div class="my-2">
                        <label for="Objections">Total Objections</label>
                        <input type="text" name="Objections" id="Objections" class="w-100">
                    </div>
                    <div class="my-2">
                        <label for="Approved">Approved</label>
                        <input type="text" name="Approved" id="Approved" class="w-100">
                    </div>

                    <div class="my-2">
                        <label for="Rejected">Rejected</label>
                        <input type="text" name="Rejected" id="Rejected" class="w-100">
                    </div>

                    <div class="my-2">
                        <label for="Reverted">Pending With Citizen Level/Reverted</label>
                        <input type="text" name="Reverted" id="Reverted" class="w-100">
                    </div>

                    <div class="my-2">
                        <label for="Reverted">Pending (as on )</label>
                       <div class="p-2 rounded" style="border:2px solid grey;">
                        <div class="my-2">
                            <label for="">Pending with MC (22-11-2023)</label>
                            <input type="date" name="" id="" class="w-100">
                        </div>

                        <div class="my-2">
                            <label for="">Pending with MC (17.01.2024)</label>
                            <input type="date" name="" id="" class="w-100">
                        </div>

                        <div class="my-2">
                            <label for="">Pending with Citizen (22-11-2023)</label>
                            <input type="date" name="" id="" class="w-100">
                        </div>

                        <div class="my-2">
                            <label for="">Pending with Citizen (17.01.2024)</label>
                            <input type="date" name="" id="" class="w-100">
                        </div>
                        <div class="my-2">
                            <label for="">Total Pending (as on date)</label>
                            <input type="date" name="" id="" class="w-100">
                        </div>

                        <div class="my-2">
                            <label for="">Percentage change in last review meeting</label>
                            <input type="date" name="" id="" class="w-100">
                        </div>
                       </div>
                    </div>

                    <div class="my-2">
                        <input type="submit" value="submit" class="btn btn-primary">
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
