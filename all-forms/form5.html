<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form5</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-sm-4">
                <h3 class="text-center">Form-5</h3>
                <form action="" method="post">
                    <div class="my-2">
                        <label for="name">MC Name</label>
                        <input type="text" name="name" id="name" class="w-100">
                    </div>

                    <div class="my-2">
                        <label for="Property">Total No of Property</label>
                        <input type="text" name="Property" id="Property" class="w-100">
                    </div>

                    <div class="my-2">
                        <label for="Owner">No. of property Owner name and Mobile No is Null (24-11-2023)</label>
                        <input type="text" name="Owner" id="Owner" class="w-100">
                    </div>

                    <div class="my-2">
                        <label for="Mobile">No. of property Owner name and Mobile No is Null (17.01.2024)</label>
                        <input type="text" name="Mobile" id="Mobile" class="w-100">
                    </div>

                    <div class="my-2">
                        <label for="Percentage">Percentage of progress</label>
                        <input type="text" name="Percentage" id="Percentage" class="w-100">
                    </div>

                    <div class="my-2">
                        <input type="submit" value="submit" class="btn btn-primary">
                    </div>
                </form>
            </div>
        </div>


    </div>
</body>
</html>
