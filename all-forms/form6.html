<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form6</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-sm-4">
                <h3 class="text-center">Form-6</h3>
                <form action="" method="post">
                    <div class="my-2">
                        <label for="name">ULB Name</label>
                        <input type="text" name="name" id="name" class="w-100">
                    </div>

                    <div class="my-2">
                        <label for="Properties">Total No. of Properties</label>
                        <input type="text" name="Properties" id="Properties" class="w-100">
                    </div>

                    <div class="my-2">
                        <label for="Self">Self Certified PIDs date 22.11.2023</label>
                        <input type="text" name="Self" id="Self" class="w-100">
                    </div>

                    <div class="my-2">
                        <label for="Certified">Self Certified PIDs (17.01.2024)</label>
                        <input type="text" name="Certified" id="Certified" class="w-100">
                    </div>

                    <div class="my-2">
                        <label for="percentage">Increase of percentage</label>
                        <input type="text" name="percentage" id="percentage" class="w-100">
                    </div>

                    <div class="my-2">
                        <input type="submit" value="submit" class="btn btn-primary">
                    </div>
                </form>
            </div>
        </div>


    </div>
</body>
</html>
