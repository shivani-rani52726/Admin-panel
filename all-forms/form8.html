<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form8</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-sm-4">
                <h3 class="text-center">Form-8</h3>
                <form action="" method="post">
                    <div class="my-2">
                        <label for="name">ULB Name</label>
                        <input type="text" name="name" id="name" class="w-100">
                    </div>

                    <div class="my-2">
                        <label for="Charges">No of received application for refund development Charges</label>
                        <input type="text" name="Charges" id="Charges" class="w-100">
                    </div>

                    <div class="my-2">
                        <label for="refund">No of cases refund Development charges as on date 17.01.2024</label>
                        <input type="text" name="refund" id="refund" class="w-100">
                    </div>

                    <div class="my-2">
                        <label for="Details">Refund Amount Details</label>
                        <input type="text" name="Details" id="Details" class="w-100">
                    </div>

                    <div class="my-2">
                        <label for="Remarks">Remarks</label>
                        <input type="text" name="Remarks" id="Remarks" class="w-100">
                    </div>

                    <div class="my-2">
                        <input type="submit" value="submit" class="btn btn-primary">
                    </div>
                </form>
            </div>
        </div>


    </div>
</body>
</html>
