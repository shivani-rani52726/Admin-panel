<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form10</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-sm-4">
                <h3 class="text-center">Form-10</h3>
                <form action="" method="post">
                    <div class="my-2">
                        <label for="name">Name of Municipality</label>
                        <input type="text" name="name" id="name" class="w-100">
                    </div>

                    <div class="my-2">
                        <label for="Property">Total Properties</label>
                        <input type="text" name="Property" id="Property" class="w-100">
                    </div>

                    <div class="my-2">
                        <label for="mapped">Properties mapped (22-11-2023)</label>
                        <input type="text" name="mapped" id="mapped" class="w-100">
                    </div>

                    <div class="my-2">
                        <label for="mapped2">Properties mapped ( 17.01.2024)</label>
                        <input type="text" name="mapped2" id="mapped2" class="w-100">
                    </div>

                    <div class="my-2">
                        <label for="Pending">Pending mapped</label>
                        <input type="text" name="Pending" id="Pending" class="w-100">
                    </div>

                    <div class="my-2">
                        <label for="percentage">Increase of percentage</label>
                        <input type="text" name="percentage" id="percentage" class="w-100">
                    </div>

                    <div class="my-2">
                        <input type="submit" value="submit" class="btn btn-primary">
                    </div>
                </form>
            </div>
        </div>


    </div>
</body>
</html>
