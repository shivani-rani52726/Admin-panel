<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>category</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row">
            <h5>Add table row</h5>
        </div>
        <div class="row">
            <div class="col-sm-6">
                <button type="button" class="btn btn-success border-success" onclick="addInput()">+ Add New</button>
            </div>
            <div class="col-sm-6">
                <input type="text" placeholder="Search" class="px-2 py-1" style="float: right;">
            </div>
        </div>
        <div class="category-list mt-4">
            <div class="row mt-4">
                <div class="col-sm-11">
                    <input type="text" name="" id="" placeholder="Appliances" class="w-100 px-3">
                </div>
                <div class="col-sm-1">
                    <i class="fa-solid fa-trash-can text-success" style="float: right;" onclick="deleteInput(this)"></i>
                </div>
            </div>
            <div class="row mt-4">
                <div class="col-sm-11">
                    <input type="text" name="" id="" placeholder="Cabinets" class="w-100 px-3">
                </div>
                <div class="col-sm-1">
                    <i class="fa-solid fa-trash-can text-success" style="float: right;" onclick="deleteInput(this)"></i>
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-sm-11">
                    <input type="text" name="" id="" placeholder="Cleaning" class="w-100 px-3">
                </div>
                <div class="col-sm-1">
                    <i class="fa-solid fa-trash-can text-success" style="float: right;" onclick="deleteInput(this)"></i>
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-sm-11">
                    <input type="text" name="" id="" placeholder="Control Panel" class="w-100 px-3">
                </div>
                <div class="col-sm-1">
                    <i class="fa-solid fa-trash-can text-success" style="float: right;" onclick="deleteInput(this)"></i>
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-sm-11">
                    <input type="text" name="" id="" placeholder="Diesel" class="w-100 px-3">
                </div>
                <div class="col-sm-1">
                    <i class="fa-solid fa-trash-can text-success" style="float: right;" onclick="deleteInput(this)"></i>
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-sm-11">
                    <input type="text" name="" id="" placeholder="DOT" class="w-100 px-3">
                </div>
                <div class="col-sm-1">
                    <i class="fa-solid fa-trash-can text-success" style="float: right;" onclick="deleteInput(this)"></i>
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-sm-11">
                    <input type="text" name="" id="" placeholder="Duraplate" class="w-100 px-3">
                </div>
                <div class="col-sm-1">
                    <i class="fa-solid fa-trash-can text-success" style="float: right;" onclick="deleteInput(this)"></i>
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-sm-11">
                    <input type="text" name="" id="" placeholder="Electric Power Station" class="w-100 px-3">
                </div>
                <div class="col-sm-1">
                    <i class="fa-solid fa-trash-can text-success" style="float: right;" onclick="deleteInput(this)"></i>
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-sm-11">
                    <input type="text" name="" id="" placeholder="Electrical" class="w-100 px-3">
                </div>
                <div class="col-sm-1">
                    <i class="fa-solid fa-trash-can text-success" style="float: right;" onclick="deleteInput(this)"></i>
                </div>
            </div>
        </div>
    </div>
    <script>
        function addInput() {
            var categoryList = document.querySelector('.category-list');
            var newRow = document.createElement('div');
            newRow.classList.add('row', 'mt-4');
            newRow.innerHTML = `
                <div class="col-sm-11">
                    <input type="text" placeholder="Add table row" class="w-100 px-3">
                </div>
                <div class="col-sm-1">
                    <i class="fa-solid fa-trash-can text-success" style="float: right;" onclick="deleteInput(this)"></i>
                </div>
            `;
            categoryList.appendChild(newRow);
        }

        function deleteInput(element) {
            var row = element.closest('.row');
            row.remove();
        }
    </script>
</body>

</html>
