<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <form>
            <div class="row">
                <div class="col-sm-12">
                    <h4>Basic Information</h4>
                </div>
            </div>
            <div class="row">
                <div class="col-sm-2">
                    <label for="name">Full name</label>
                </div>
                <div class="col-sm-5">
                    <input type="text" placeholder="first name" class="w-100 rounded px-2">
                </div>
                 <div class="col-sm-5">
                    <input type="text" placeholder="last name" class="w-100 rounded px-2">
                </div>
            </div>
            <div class="row my-3">
                <div class="col-sm-2">
                    <label for="email">Email</label>
                </div>
                    <div class="col-sm-10">
                        <input type="email" placeholder="Email" class="w-100 rounded px-2">
                    </div>
            </div>

            <div class="row my-3">
                <div class="col-sm-2">
                    <label for="phone">Phone(Optional)</label>
                </div>
                    <div class="col-sm-10">
                        <input type="number" placeholder="Enter Phone" class="w-100 rounded px-2">
                    </div>
            </div>

            <div class="row my-3">
                <div class="col-sm-2">
                    <label for="Location">Location</label>
                </div>
                    <div class="col-sm-10">
                        <select class="rounded w-100 px-2">
                            <option selected>Select Country</option>
                            <option>India</option>
                            <option>Nepal</option>
                            <option>Pakistan</option>
                        </select>
                    </div>
            </div>

            <div class="row my-3">
                <div class="col-sm-2">
                    <label for="address1">Address line 1</label>
                </div>
                    <div class="col-sm-10">
                        <input type="text" placeholder="Enter Address line 1" class="w-100 rounded px-2">
                    </div>
            </div>

            <div class="row my-3">
                <div class="col-sm-2">
                    <label for="address2">Address line 2</label>
                </div>
                    <div class="col-sm-10">
                        <input type="text" placeholder="Enter Address line 2" class="w-100 rounded px-2">
                    </div>
            </div>

            <div class="row my-3">
                <div class="col-sm-2">
                    <label for="zipcode">Zip code</label>
                </div>
                    <div class="col-sm-10">
                        <input type="number" placeholder="Enter Zip code" class="w-100 rounded px-2">
                    </div>
            </div>

            <div class="row">
                <div class="col-sm-2"></div>
                <div class="col-sm-10">
                    <button type="button" class="btn text-light" style="background-color:rgb(62, 47, 194);border-color:rgb(62, 47, 194);">Save changes</button>
                </div>
            </div>
        </form>
        
    </div>
</body>

</html>
